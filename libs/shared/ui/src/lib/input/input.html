<div class="flex flex-col gap-1 w-full">

  @if (label()) {
  <label [for]="controlId" class="text-sm font-medium text-gray-700 block">
    {{ label() }}
  </label>
  }

  @switch (type()) {

  @case ('password') {
  <p-password [inputId]="controlId" [placeholder]="placeholder()" [disabled]="isControlDisabled" [feedback]="false"
    [toggleMask]="true" [ngModel]="value()" (ngModelChange)="updateValue($event)" [ngModelOptions]="{ standalone: true }"
    (onBlur)="onBlur()" styleClass="w-full" inputStyleClass="w-full" />
  }

  @case ('textarea') {
  <textarea pTextarea [id]="controlId" [placeholder]="placeholder()" [disabled]="isControlDisabled"
    [readOnly]="isReadonly()" [value]="value()" (input)="onTextareaInput($event)" (blur)="onBlur()" class="w-full"
    rows="4"></textarea>
  }

  @case ('calendar') {
  <p-datepicker [inputId]="controlId" [placeholder]="placeholder()" [disabled]="isControlDisabled"
    [readonlyInput]="isReadonly()" [ngModel]="value()" (ngModelChange)="updateValue($event)"
    [ngModelOptions]="{ standalone: true }" (onBlur)="onBlur()" styleClass="w-full" />
  }

  @default {
  <input pInputText [id]="controlId" [type]="type()" [placeholder]="placeholder()" [disabled]="isControlDisabled"
    [readOnly]="isReadonly()" [value]="value() ?? ''" (input)="onInput($event)" (blur)="onBlur()"
    class="w-full block" />
  }

  }

  @if (formControl(); as ctrl) {
  <lib-error-message [control]="ctrl" [fieldName]="label()" />
  } @else if (helperText()) {
  <small class="text-gray-500 text-xs block">
    {{ helperText() }}
  </small>
  }

</div>
