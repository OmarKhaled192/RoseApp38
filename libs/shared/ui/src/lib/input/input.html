<div class="flex flex-col gap-1 w-full" >

  @if (label()) {
    <label class="text-sm font-medium text-gray-700 block">
      {{ label() }}
    </label>
  }

  @if (type() === 'password') {
    <p-password
      [placeholder]="placeholder()"
      [disabled]="disabled"
      [feedback]="false"
      [toggleMask]="true"
      [ngModel]="value()"
      (ngModelChange)="onChange($event); value.set($event)"
      (blur)="onBlur()"
      styleClass="w-full"
      inputStyleClass="w-full"
    />
  } @else {
    <input
      pInputText
      [type]="type()"
      [placeholder]="placeholder()"
      [disabled]="disabled"
      [readOnly]="isReadonly()"
      [value]="value()"
      (input)="onInput($event)"
      (blur)="onBlur()"
      class="w-full block"
    />
  }

  @if (errorMessage()) {
    <small class="text-red-500 text-xs block"><lib-error-message [message]="errorMessage()" /></small>
  } @else if (helperText()) {
    <small class="text-gray-500 text-xs block">{{ helperText() }}</small>
  }
</div>
