  <p-button
      [label]="label()"
      [icon]="icon()"
      [style]="{ 'background-color': color(), 'border-color': color() }"
      [iconPos]="iconPos()"
      [severity]="severity()"
      [outlined]="outlined()"
      [text]="text()"
      [raised]="raised()"
      [rounded]="rounded()"
      [disabled]="disabled()"
      [loading]="loading()"
      [type]="type()"
      [badge]="badge()"
      [badgeSeverity]="badgeSeverity()"
      [styleClass]="styleClass()"
      [pTooltip]="tooltip()"
      [tooltipPosition]="tooltipPosition()"
      (onClick)="handleClick($event)"
    />
