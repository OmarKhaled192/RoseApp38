<button type="button" class="theme-toggle" (click)="toggle()"
  [attr.aria-label]="isDark() ? 'Switch to light mode' : 'Switch to dark mode'">
  <div class="toggle-track" [class.dark]="isDark()">
    <div class="stars-container">
      <div class="star star-1"></div>
      <div class="star star-2"></div>
      <div class="star star-3"></div>
    </div>

    <div class="toggle-thumb" [class.dark]="isDark()">
      @if (!isDark()) {
      <svg class="icon sun-icon" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="5" fill="currentColor" />
        <path
          d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
      }
      @else {
      <svg class="icon moon-icon" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12.3 3a7.5 7.5 0 0 0 7.92 12.446A9 9 0 1 1 12.294 3z" />
      </svg>
      }
    </div>
  </div>
</button>
