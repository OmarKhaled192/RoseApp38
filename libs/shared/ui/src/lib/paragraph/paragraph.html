<div class="flex flex-col gap-2">
  @if (header()) {
  <h2 class="m-0 text-[24px] font-semibold leading-[100%] tracking-normal text-[#2F3137]">
    {{ header() }}
  </h2>
  }

  @if (descriptionBeforeLink() || descriptionAfterLink() || linkText()) {
  <p class="m-0 text-[16px] font-normal leading-[100%] tracking-normal text-[#4B4F56]">
    {{ descriptionBeforeLink() }}

    @if (linkText() && linkRoute()) {
    <a class="cursor-pointer font-medium underline" [routerLink]="linkRoute()">
      {{ linkText() }}
    </a>
    }

    {{ descriptionAfterLink() }}
  </p>
  }
</div>
