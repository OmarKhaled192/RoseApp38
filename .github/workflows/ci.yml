name: CI

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set Nx SHAs
        uses: nrwl/nx-set-shas@v5

      - name: Install Playwright
        run: npx playwright install --with-deps

      # Nx Cloud distributed execution
      - name: Start Nx Cloud CI
        run: npx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="e2e"

      - name: Run Nx CI
        run: npx nx affected -t lint test build typecheck e2e

      - name: Fix CI
        run: npx nx fix-ci
        if: always()
