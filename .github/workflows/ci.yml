name: CI

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set Nx SHAs
        uses: nrwl/nx-set-shas@v5

      - name: Start Nx Cloud CI
        run: pnpm exec nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="test"

      - name: Run Nx tasks
        run: pnpm exec nx affected -t lint test build typecheck