name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shell app
        run: npx nx build shell --configuration=production --base-href=/${{ github.event.repository.name }}/

      - name: Build authApp
        run: npx nx build authApp --configuration=production --base-href=/${{ github.event.repository.name }}/authApp/

      - name: Build adminDashboard
        run: npx nx build adminDashboard --configuration=production --base-href=/${{ github.event.repository.name }}/adminDashboard/

      - name: Build roseApp
        run: npx nx build roseApp --configuration=production --base-href=/${{ github.event.repository.name }}/roseApp/

      - name: Assemble deploy folder
        run: |
          mkdir -p deploy-output
          cp -r dist/apps/shell/* deploy-output/ || cp -r dist/shell/* deploy-output/
          mkdir -p deploy-output/authApp
          cp -r dist/apps/authApp/* deploy-output/authApp/ || cp -r dist/authApp/* deploy-output/authApp/
          mkdir -p deploy-output/adminDashboard
          cp -r dist/apps/adminDashboard/* deploy-output/adminDashboard/ || cp -r dist/adminDashboard/* deploy-output/adminDashboard/
          mkdir -p deploy-output/roseApp
          cp -r dist/apps/roseApp/* deploy-output/roseApp/ || cp -r dist/roseApp/* deploy-output/roseApp/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy-output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
