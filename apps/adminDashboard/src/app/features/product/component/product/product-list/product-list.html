<div class="p-6 rounded-2xl border border-slate-100 bg-white p-6 shadow-sm md:p-8">
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-xl font-bold text-gray-900">
      {{ 'products.allProducts' | translate }}
    </h1>

    <button routerLink="/admin/product/add"
      class="bg-[#A6252A] text-white px-4 py-2 rounded-lg text-sm font-semibold flex items-center justify-center gap-2">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4.58325 11.0002H17.4166M10.9999 4.5835V17.4168" stroke="white" stroke-width="2.08333"
          stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <span class="hidden md:inline">
        {{ 'products.addNewProduct' | translate }}
      </span>
    </button>
  </div>

  <div class="relative mb-4">
    <i class="pi pi-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
    <input type="text" [ngModel]="searchTerm()" (ngModelChange)="onSearchChange($event)"
      [placeholder]="'common.search' | translate"
      class="w-full pl-10 pr-4 py-2.5 border border-gray-200 rounded-xl text-sm text-gray-700 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#A6252A]/20 focus:border-[#A6252A]" />
  </div>

  <app-reusable-table [columns]="productColumns" [data]="products()" [totalRecords]="totalRecords()"
    (actionClicked)="onAction($event)" (pageChange)="onPageChange($event)" />
</div>

<lib-checkout-delete-modal [open]="deletingProduct()" [title]="'product.confirmDeleteTitle' | translate"
  [confirmLabel]="'product.confirmDeleteYes' | translate" [cancelLabel]="'product.confirmDeleteNo' | translate"
  (confirmed)="confirmDelete()" (cancelled)="cancelDelete()" />
