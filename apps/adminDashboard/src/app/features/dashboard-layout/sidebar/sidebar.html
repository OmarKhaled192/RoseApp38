
<div class="hidden md:flex w-[225px] h-screen bg-white border-r border-[#F0E9EA] flex-col text-[#3A2C30]">

   
    <div class="px-5 pt-6 pb-3 flex justify-center">
        <img src="assets/imgs/logo 1.svg" alt="logo">
    </div>

  
    <a routerLink="/preview"
        class="flex items-center justify-center gap-2 mx-4 mt-2 mb-[18px] h-11 bg-[#9E1B41] hover:bg-[#83163a] text-white rounded-[10px] no-underline text-[13px] font-semibold transition-colors duration-200">
        <img src="assets/imgs/flower.svg" alt="logo" class="text-sm">
        <span>Preview Website</span>
    </a>


    <nav class="flex flex-col gap-1 px-3">

        <a routerLink="" routerLinkActive="bg-[#FCE7EB] text-[#9E1B41] font-semibold"
            [routerLinkActiveOptions]="{ exact: true }"
            class="flex items-center gap-2.5 h-[42px] px-3.5 rounded-[10px] text-[#6B5C60] no-underline text-[13px] font-medium transition-colors duration-200 hover:bg-[#FBEFF1] hover:text-[#9E1B41]">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="3" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2" />
                <rect x="14" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2" />
                <rect x="3" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2" />
                <rect x="14" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2" />
            </svg>
            <span>Overview</span>
        </a>

        <a routerLink="" routerLinkActive="bg-[#FCE7EB] text-[#9E1B41] font-semibold"
            class="flex items-center gap-2.5 h-[42px] px-3.5 rounded-[10px] text-[#6B5C60] no-underline text-[13px] font-medium transition-colors duration-200 hover:bg-[#FBEFF1] hover:text-[#9E1B41]">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="5" y="4" width="14" height="17" rx="2" stroke="currentColor" stroke-width="2" />
                <path d="M9 4.5V3.5C9 2.67 9.67 2 10.5 2H13.5C14.33 2 15 2.67 15 3.5V4.5" stroke="currentColor"
                    stroke-width="2" />
                <path d="M9 10H15" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                <path d="M9 14H15" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                <path d="M9 18H12" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
            <span>Categories</span>
        </a>

        <a routerLink="" routerLinkActive="bg-[#FCE7EB] text-[#9E1B41] font-semibold"
            [routerLinkActiveOptions]="{ exact: true }"
            class="flex items-center gap-2.5 h-[42px] px-3.5 rounded-[10px] text-[#6B5C60] no-underline text-[13px] font-medium transition-colors duration-200 hover:bg-[#FBEFF1] hover:text-[#9E1B41]">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="2" />
                <path d="M3 9H21" stroke="currentColor" stroke-width="2" />
                <path d="M8 3V7" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                <path d="M16 3V7" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                <path
                    d="M12 17.5L11.2 16.8C9.3 15.2 8 14.1 8 12.7 C8 11.6 8.8 10.8 9.9 10.8 C10.5 10.8 11.2 11.1 12 11.9 C12.8 11.1 13.5 10.8 14.1 10.8 C15.2 10.8 16 11.6 16 12.7 C16 14.1 14.7 15.2 12.8 16.8L12 17.5Z"
                    stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
            </svg>
            <span>Occasions</span>
        </a>

        <a routerLink="" routerLinkActive="bg-[#FCE7EB] text-[#9E1B41] font-semibold"
            class="flex items-center gap-2.5 h-[42px] px-3.5 rounded-[10px] text-[#6B5C60] no-underline text-[13px] font-medium transition-colors duration-200 hover:bg-[#FBEFF1] hover:text-[#9E1B41]">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M3.5 7.5L12 3L20.5 7.5V16.5L12 21L3.5 16.5V7.5Z" stroke="currentColor" stroke-width="2"
                    stroke-linejoin="round" />
                <path d="M3.5 7.5L12 12L20.5 7.5" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
                <path d="M12 12V21" stroke="currentColor" stroke-width="2" />
                <path d="M7.5 5.5L16 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
            <span>Products</span>
        </a>

    </nav>

    <div class="flex-1 bg-transparent"></div>


    <div class="h-16 border-t border-[#F0E9EA] flex items-center px-4 gap-2.5">
        <app-userAavatar [name]="user?.name" [email]="user?.email" [photoUrl]="user?.photoUrl"
            [size]="40"></app-userAavatar>
        <div class="flex-1 min-w-0">
            <h5 class="m-0 text-xs font-semibold text-[#3A2C30] whitespace-nowrap overflow-hidden text-ellipsis">{{
                user?.name }}</h5>
            <p class="mt-0.5 mb-0 text-[#9C8D91] text-[10px] whitespace-nowrap overflow-hidden text-ellipsis">{{
                user?.email }}</p>
        </div>
        <div class="relative">
            <button class="bg-transparent border-none text-[#B7AAAE] hover:text-[#6B5C60] cursor-pointer text-sm p-1.5"
                (click)="toggleMenu($event)">
                <i class="pi pi-ellipsis-v"></i>
            </button>
            @if (menuOpen) {
            <div
                class="absolute bottom-[calc(100%+8px)] right-0 min-w-[170px] bg-white rounded-[10px] shadow-[0_6px_20px_rgba(0,0,0,0.12)] py-2 z-50 animate-[fadeIn_0.15s_ease-out]">
                <div class="px-4 pt-2.5 pb-2 text-[13px] font-bold text-[#9E1B41]">{{ user?.name }}</div>
                <div class="h-px bg-[#F0E9EA] my-1"></div>
                <a class="flex items-center gap-2.5 px-4 py-2.5 text-[13px] text-[#3A2C30] no-underline cursor-pointer transition-colors duration-150 hover:bg-[#FBEFF1] hover:text-[#9E1B41] group"
                    (click)="goToAccount()">
                    <i class="pi pi-user text-sm text-[#8B9199] w-3.5 group-hover:text-[#9E1B41]"></i>
                    <span>Profile</span>
                </a>
                <a class="flex items-center gap-2.5 px-4 py-2.5 text-[13px] text-[#3A2C30] no-underline cursor-pointer transition-colors duration-150 hover:bg-[#FBEFF1] hover:text-[#9E1B41] group"
                    (click)="logout()">
                    <i class="pi pi-sign-out text-sm text-[#8B9199] w-3.5 group-hover:text-[#9E1B41]"></i>
                    <span>Log out</span>
                </a>
            </div>
            }
        </div>
    </div>

</div>

<div
    class="flex md:hidden fixed bottom-0 left-0 right-0 h-16 bg-white border-t border-[#F0E9EA] items-center px-2 z-40">


    <div class="flex flex-1 items-center justify-around h-full relative">

        <a routerLink="" routerLinkActive="text-[#9E1B41] font-semibold" [routerLinkActiveOptions]="{ exact: true }"
            class="flex flex-col items-center justify-center gap-1 flex-1 h-full text-[#6B5C60] no-underline text-[10px] font-medium">
            <span
                class="flex items-center justify-center w-9 h-8 rounded-[10px]"
                [ngClass]="{ 'bg-[#FCE7EB]':'' }">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="3" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2" />
                    <rect x="14" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2" />
                    <rect x="3" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2" />
                    <rect x="14" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2" />
                </svg>
            </span>
            <span>Overview</span>
        </a>

        <a routerLink="" routerLinkActive="text-[#9E1B41] font-semibold"
            class="flex flex-col items-center justify-center gap-1 flex-1 h-full text-[#6B5C60] no-underline text-[10px] font-medium">
            <span class="flex items-center justify-center w-9 h-8 rounded-[10px]">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="5" y="4" width="14" height="17" rx="2" stroke="currentColor" stroke-width="2" />
                    <path d="M9 4.5V3.5C9 2.67 9.67 2 10.5 2H13.5C14.33 2 15 2.67 15 3.5V4.5" stroke="currentColor"
                        stroke-width="2" />
                    <path d="M9 10H15" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    <path d="M9 14H15" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    <path d="M9 18H12" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                </svg>
            </span>
            <span>Categories</span>
        </a>


        <div class="w-12 flex-shrink-0"></div>

        <a routerLink="" routerLinkActive="text-[#9E1B41] font-semibold" [routerLinkActiveOptions]="{ exact: true }"
            class="flex flex-col items-center justify-center gap-1 flex-1 h-full text-[#6B5C60] no-underline text-[10px] font-medium">
            <span class="flex items-center justify-center w-9 h-8 rounded-[10px]">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="3" y="5" width="18" height="16" rx="2" stroke="currentColor" stroke-width="2" />
                    <path d="M3 9H21" stroke="currentColor" stroke-width="2" />
                    <path d="M8 3V7" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    <path d="M16 3V7" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    <path
                        d="M12 17.5L11.2 16.8C9.3 15.2 8 14.1 8 12.7 C8 11.6 8.8 10.8 9.9 10.8 C10.5 10.8 11.2 11.1 12 11.9 C12.8 11.1 13.5 10.8 14.1 10.8 C15.2 10.8 16 11.6 16 12.7 C16 14.1 14.7 15.2 12.8 16.8L12 17.5Z"
                        stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
                </svg>
            </span>
            <span>Occasions</span>
        </a>

        <a routerLink="" routerLinkActive="text-[#9E1B41] font-semibold"
            class="flex flex-col items-center justify-center gap-1 flex-1 h-full text-[#6B5C60] no-underline text-[10px] font-medium">
            <span class="flex items-center justify-center w-9 h-8 rounded-[10px]">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M3.5 7.5L12 3L20.5 7.5V16.5L12 21L3.5 16.5V7.5Z" stroke="currentColor" stroke-width="2"
                        stroke-linejoin="round" />
                    <path d="M3.5 7.5L12 12L20.5 7.5" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
                    <path d="M12 12V21" stroke="currentColor" stroke-width="2" />
                    <path d="M7.5 5.5L16 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                </svg>
            </span>
            <span>Products</span>
        </a>

        <a routerLink="/preview"
            class="absolute left-1/2 -translate-x-1/2 -top-6 flex items-center justify-center w-11 h-11 rounded-full bg-[#9E1B41] hover:bg-[#83163a] shadow-[0_4px_10px_rgba(158,27,65,0.35)] ring-[3px] ring-[#9E1B41] transition-colors duration-200">
            <img src="assets/imgs/flower.svg" alt="logo" class="w-5 h-5 invert brightness-0 filter">
        </a>
    </div>

</div>
