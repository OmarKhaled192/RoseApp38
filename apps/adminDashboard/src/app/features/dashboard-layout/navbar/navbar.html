<header
    class="relative flex h-16 w-full items-center justify-between border-b border-[#F0E9EA] dark:border-gray-800 bg-white dark:bg-gray-900 px-4 md:px-7 transition-colors duration-200">

    <div class="flex items-center gap-2.5 md:hidden">
        <img
            src="images/logo.svg"
            alt="logo"
            class="h-8 w-8 shrink-0" />

        <app-breadcrumb />
    </div>

    <div class="hidden md:block">
        <app-breadcrumb />
    </div>

    <!-- Desktop: Language Switcher and Dark Mode -->
    <div class="hidden md:flex items-center gap-3">
        <lib-language-switcher
            (languageChanged)="onLanguageChanged($event)"
            classList="text-[#6B5C60] dark:text-gray-300 hover:text-[#9E1B41] dark:hover:text-[#f3a4b9] font-medium transition-colors duration-200 cursor-pointer text-sm"></lib-language-switcher>

        <div class="w-px h-5 bg-[#F0E9EA] dark:bg-gray-700"></div>

        <lib-dark-mode></lib-dark-mode>
    </div>

    <!-- Mobile: Language Switcher, Dark Mode, Avatar & Menu -->
    <div class="relative flex items-center gap-2 md:hidden">
        <lib-language-switcher
            (languageChanged)="onLanguageChanged($event)"
            classList="text-[#6B5C60] dark:text-gray-300 hover:text-[#9E1B41] dark:hover:text-[#f3a4b9] font-medium transition-colors duration-200 cursor-pointer !px-1.5 !py-1 text-xs"></lib-language-switcher>

        <lib-dark-mode></lib-dark-mode>

        <app-userAavatar [size]="36" />

        <button
            type="button"
            class="cursor-pointer border-none bg-transparent p-1.5 text-[#3A2C30] dark:text-gray-200"
            (click)="toggleMobileMenu($event)">
            <i class="pi pi-bars text-lg"></i>
        </button>

        @if (menuOpen) {
        <div
            class="absolute right-0 rtl:right-auto rtl:left-0 top-[calc(100%+8px)] z-50 min-w-[170px]
               rounded-[10px] bg-white dark:bg-gray-800 py-2 border border-gray-100 dark:border-gray-700
               shadow-[0_6px_20px_rgba(0,0,0,0.12)]">

            <button
                type="button"
                class="group flex w-full cursor-pointer items-center gap-2.5
                    border-none bg-transparent px-4 py-2.5 text-left rtl:text-right
                    text-[13px] text-[#3A2C30] dark:text-gray-200
                    transition-colors duration-150
                    hover:bg-[#FBEFF1] dark:hover:bg-gray-700 hover:text-[#9E1B41] dark:hover:text-[#f3a4b9]"
                (click)="goToAccount()">
                <i
                    class="pi pi-user w-3.5 text-sm text-[#8B9199] dark:text-gray-400
                    group-hover:text-[#9E1B41] dark:group-hover:text-[#f3a4b9]"></i>

                <span>{{ 'dashboard.userMenu.profile' | translate }}</span>
            </button>

            <button
                type="button"
                class="group flex w-full cursor-pointer items-center gap-2.5
                 border-none bg-transparent px-4 py-2.5 text-left rtl:text-right
                 text-[13px] text-[#3A2C30] dark:text-gray-200
                 transition-colors duration-150
                 hover:bg-[#FBEFF1] dark:hover:bg-gray-700 hover:text-[#9E1B41] dark:hover:text-[#f3a4b9]"
                (click)="logout()">
                <i
                    class="pi pi-sign-out w-3.5 text-sm text-[#8B9199] dark:text-gray-400 group-hover:text-[#9E1B41] dark:group-hover:text-[#f3a4b9]"></i>
                <span>{{ 'dashboard.userMenu.logout' | translate }}</span>
            </button>

        </div>
        }
    </div>
</header>
