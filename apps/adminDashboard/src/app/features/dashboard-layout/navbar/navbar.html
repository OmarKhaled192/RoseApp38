<header
    class="relative flex h-16 w-full items-center justify-between border-b border-[#F0E9EA] bg-white px-4 md:px-7">

    <div class="flex items-center gap-2.5 md:hidden">
        <img
            src="images/logo.svg"
            alt="logo"
            class="h-8 w-8 shrink-0" />

        <p-breadcrumb
            [model]="items"
            styleClass="!border-0 !bg-transparent !p-0" />
    </div>

    <div class="hidden md:block">
        <p-breadcrumb
            [model]="items"
            styleClass="!border-0 !bg-transparent !p-0" />
    </div>

    <div class="relative flex items-center gap-3 md:hidden">

        <app-userAavatar [size]="40" />

        <button
            type="button"
            class="cursor-pointer border-none bg-transparent p-1.5 text-[#3A2C30]"
            (click)="toggleMobileMenu($event)">
            <i class="pi pi-bars text-lg"></i>
        </button>

        @if (menuOpen) {
        <div
            class="absolute right-0 top-[calc(100%+8px)] z-50 min-w-[170px]
               rounded-[10px] bg-white py-2
               shadow-[0_6px_20px_rgba(0,0,0,0.12)]">

            <button
                type="button"
                class="group flex w-full cursor-pointer items-center gap-2.5
                    border-none bg-transparent px-4 py-2.5 text-left
                    text-[13px] text-[#3A2C30]
                    transition-colors duration-150
                    hover:bg-[#FBEFF1] hover:text-[#9E1B41]"
                (click)="goToAccount()">
                <i
                    class="pi pi-user w-3.5 text-sm text-[#8B9199]
                    group-hover:text-[#9E1B41]"></i>

                <span>Profile</span>
            </button>

            <button
                type="button"
                class="group flex w-full cursor-pointer items-center gap-2.5
                 border-none bg-transparent px-4 py-2.5 text-left
                 text-[13px] text-[#3A2C30]
                 transition-colors duration-150
                 hover:bg-[#FBEFF1] hover:text-[#9E1B41]"
                (click)="logout()">
                <i
                    class="pi pi-sign-out w-3.5 text-sm text-[#8B9199] group-hover:text-[#9E1B41]"></i>
                <span>Log out</span>
            </button>

        </div>
        }
    </div>
</header>
