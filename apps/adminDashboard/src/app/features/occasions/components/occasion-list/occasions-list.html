<section class="occasions-page">
  <div class="page-header">
    <h1>{{ 'dashboard.occasions.title' | translate }}</h1>
    <a class="primary-btn" routerLink="/admin/occasions/add">
      <span class="plus">+</span>
      <span>{{ 'dashboard.occasions.addAction' | translate }}</span>
    </a>
  </div>

  <div class="toolbar">
    <div class="search-box">
      <span class="search-icon">⌕</span>
      <input
        type="search"
        [placeholder]="'dashboard.occasions.searchPlaceholder' | translate"
        [value]="search()"
        (input)="onSearch($event)"
      />
    </div>
  </div>

  <div class="table-shell">
    <app-reusable-table
      [data]="paginatedItems()"
      [columns]="columns"
      (actionClicked)="onTableAction($event)"
    >
    </app-reusable-table>
  </div>

  <div class="pagination-wrap">
    <lib-pagination [totalRecords]="totalRecords()" (pageChange)="onPageChange($event)" />
  </div>
</section>
