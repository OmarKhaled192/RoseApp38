<div class="flex items-start justify-start p-6 min-h-screen bg-white">
  <div class="w-full max-w-sm pt-6">

    <button
      class="mb-8 w-10 h-10 flex items-center justify-center border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-gray-600" fill="none" viewBox="0 0 24 24"
        stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
      </svg>
    </button>

    <h1 class="text-2xl font-bold text-gray-900 mb-4">
      {{ 'passwordReset.title' | translate }}
    </h1>

    <p class="text-gray-800 text-sm leading-relaxed mb-4">
      {{ 'passwordReset.msg1_prefix' | translate }}
      <a [href]="'mailto:' + email" class="text-blue-500 hover:underline">{{ email }}</a>.
    </p>

    <p class="text-gray-800 text-sm leading-relaxed mb-4">
      {{ 'passwordReset.msg2' | translate }}
    </p>

    <p class="text-gray-400 text-sm leading-relaxed mb-10">
      {{ 'passwordReset.msg3' | translate }}
    </p>

    <hr class="border-gray-200 mb-6" />
    <!-- <lib-paragraph header=" {{ 'passwordReset.msg4' | translate }}" linkText=" {{ 'passwordReset.msg5' | translate }}"
      [linkRoute]="['/register']" /> -->


  </div>
</div>
