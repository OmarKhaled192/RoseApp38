<div class="login-wrapper w-full flex flex-col gap-4 sm:gap-6 px-4 sm:px-6 md:px-0 max-w-md mx-auto">
  <lib-paragraph [header]="'resetPassword.title' | translate"
    [descriptionBeforeLink]="'resetPassword.subtitle' | translate" />

  <form [formGroup]="form()" (ngSubmit)="onSubmit()" class="flex flex-col gap-3 sm:gap-4 w-full">

    <div class="form-field w-full">
      <lib-input type="password" formControlName="newPassword"
        [label]="'resetPassword.passwordLabel' | translate" placeholder="********" />
    </div>

    <div class="form-field w-full">
      <lib-input type="password" formControlName="confirmPassword"
        [label]="'resetPassword.confirmPasswordLabel' | translate" placeholder="********" />
    </div>


    <div class="w-full mt-2">
      <lib-button type="submit" [label]="'resetPassword.submitButton' | translate" [loading]="isLoading()"
        [color]="isDark() ? '#FFA6B9' : '#8D1C24'" [disabled]="form().invalid || isLoading()"
        styleClass="w-full py-2.5 sm:py-3 text-sm sm:text-base font-semibold" />
    </div>

  </form>

  <div class="divider border-b border-gray-200 w-full"></div>

  <div class="footer-container text-sm sm:text-base">
    <lib-question-repeat [question]="'resetPassword.needHelp' | translate"
      [answer]="'resetPassword.contactUs' | translate" [routerLink]="['/contact-us']" />
  </div>

</div>
