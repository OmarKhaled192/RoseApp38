<div class="register-email-wrapper w-full flex flex-col gap-6">

  <div class="header-container text-center">
    <lib-title-form [title]="'auth.createAccount' | translate" />
  </div>
 <div >
      <h3 class="text-lg my-2 font-semibold text-gray-700">{{ 'auth.writeyouraccount' | translate }}</h3>

  <div class="divider my-3 border-b border-gray-200 w-full"></div>

  <form [formGroup]="registerEmailForm()" (ngSubmit)="onSubmit()" class="flex flex-col gap-4 w-full">

    <div class="form-field">
      <lib-input
        formControlName="email"
        [label]="'auth.email' | translate"
        placeholder="user@example.com"
      />
    </div>

    <div class="w-full mt-2">
      <lib-button
        type="submit"
        [label]="'auth.continue' | translate"
        [loading]="isLoading()"
        [disabled]="registerEmailForm().invalid || isLoading()"
        [color]="isDark() ? '#FFA6B9' : '#8D1C24'"
        styleClass="w-full py-3 text-base font-semibold"
      />
    </div>

  </form>

  <div class="divider border-b border-gray-200 w-full"></div>

  <div class="footer-container">
    <lib-question-repeat
      [question]="'auth.haveAccount' | translate"
      [answer]="'auth.login' | translate"
      [routerLink]="['/auth/login']"
    />
  </div>

</div>
