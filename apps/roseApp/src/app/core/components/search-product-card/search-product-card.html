<a [routerLink]="'/roseApp/product/' + card.id" (click)="onSelect()"
  class="flex items-center gap-4 px-4 py-3 hover:bg-gray-50 transition-colors duration-150 cursor-pointer">
  <img [src]="card.cover" [alt]="card.title" class="w-14 h-14 rounded-md object-cover shrink-0 bg-gray-100" />

  <div class="flex-1 min-w-0">
    <p class="text-sm font-semibold text-gray-800 truncate">
      {{ card.title }}
    </p>

    <div class="flex items-baseline gap-2 mt-1">
      @if (finalPrice) {
      <span class="text-sm font-bold text-gray-900">{{ finalPrice }}</span>
      <span class="text-xs text-gray-400 line-through">{{ card.price }}</span>
      } @else {
      <span class="text-sm font-bold text-gray-900">{{ card.price }}</span>
      }
      <span class="text-xs text-gray-500">{{ 'CURRENCY.EGP' | translate }}</span>
    </div>
  </div>

  <div class="flex items-center gap-1 shrink-0 text-xs">
    <svg class="w-3.5 h-3.5 text-amber-400 fill-amber-400" viewBox="0 0 24 24">
      <path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14l-5-4.87 6.91-1.01L12 2z" />
    </svg>
    <span class="text-gray-700 font-medium">{{ card.rating }}/5</span>
    <span class="text-[#e07090]">({{ card.ratings }} {{ 'PRODUCT.RATINGS' | translate }})</span>
  </div>
</a>
