<nav class="w-full bg-white border-b border-gray-200 px-4 py-2 md:px-6 flex items-center gap-3 md:gap-4">
  <!-- Logo + Deliver To -->
  <div class="flex items-center gap-3 shrink-0">
    <a href="#" class="logo-icon shrink-0">
      <img src="images/logo 1.png" alt="Rose Logo" class="w-10 md:w-12" />
    </a>

    @if (isLoggedIn()) {
    <button (click)="onChangeLocation()"
      class="hidden md:flex flex-col items-start leading-tight text-left cursor-pointer group">
      <span class="text-[11px] text-gray-400">Deliver to:</span>
      <span
        class="flex items-center gap-1 text-sm font-medium text-gray-700 group-hover:text-[#e07090] transition-colors duration-200">
        <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" />
          <circle cx="12" cy="10" r="3" />
        </svg>
        {{ deliveryCity() }}
      </span>
    </button>
    }
  </div>

  <!-- Search Bar (hidden on mobile, visible md+) -->
  <div
    class="search-container hidden md:flex flex-1 items-center flex-col border border-gray-300 rounded-md px-4 py-2 gap-2 bg-white hover:border-gray-400 focus-within:border-[#e07090] transition-colors duration-200 relative">
    <div class="flex items-center w-full gap-2">
      <svg class="w-4 h-4 text-gray-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2"
        viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8" />
        <path d="m21 21-4.35-4.35" />
      </svg>
      <input type="text" placeholder="What awesome gift are you looking for?" [(ngModel)]="searchQuery"
        (focus)="openSearch()" (keyup.enter)="onSearch()"
        class="flex-1 bg-transparent outline-none text-sm text-gray-700 placeholder-gray-400" />
    </div>
    @if (searchOpen && searchQuery.trim()) {
    <app-search-products [searchQuery]="searchQuery" (cardSelected)="closeSearch()"></app-search-products>
    }
  </div>

  <!-- Mobile: search icon button (opens search bar) -->
  <button class="md:hidden ml-auto text-gray-500 hover:text-[#e07090] transition-colors duration-200"
    (click)="toggleMobileSearch()">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="8" />
      <path d="m21 21-4.35-4.35" />
    </svg>
  </button>

  <!-- Right Actions -->
  <div class="flex items-center gap-3 md:gap-4 shrink-0">
    <!-- Login / User Menu -->
    @if (isLoggedIn()) {
    <div class="relative user-menu-trigger">
      <button (click)="toggleUserMenu()"
        class="flex items-center gap-1.5 text-sm text-gray-700 hover:text-[#e07090] transition-colors duration-200 cursor-pointer">
        <span class="hidden sm:flex flex-col items-start leading-tight">
          <span class="text-[11px] text-gray-400">Hello,</span>
          <span class="font-medium text-[#741C21]">{{ firstName }}</span>
        </span>
        <svg class="w-3.5 h-3.5 text-gray-400 transition-transform duration-200" [class.rotate-180]="userMenuOpen"
          fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="m6 9 6 6 6-6" />
        </svg>
      </button>

      @if (userMenuOpen) {
      <div class="absolute right-0 mt-2 w-52 bg-white rounded-lg shadow-lg border border-gray-100 py-2 z-[999999999]">
        <div class="px-4 py-2 border-b border-gray-100">
          <p class="text-sm font-semibold text-[#741C21]">
            {{ firstName }}
          </p>
        </div>

        <a routerLink="/roseApp/setting/profile" (click)="closeUserMenu()"
          class="flex items-center gap-3 px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 hover:text-[#e07090] transition-colors duration-200 cursor-pointer">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
          Account
        </a>

        <a routerLink="/roseApp/address" (click)="closeUserMenu()"
          class="flex items-center gap-3 px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 hover:text-[#e07090] transition-colors duration-200 cursor-pointer">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" />
            <circle cx="12" cy="10" r="3" />
          </svg>
          Addresses
        </a>

        <a routerLink="/roseApp/orders" (click)="closeUserMenu()"
          class="flex items-center gap-3 px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 hover:text-[#e07090] transition-colors duration-200 cursor-pointer">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <path d="M3 7h18M5 7v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3" />
          </svg>
          Orders
        </a>
        <a routerLink="/roseApp/dashboard" (click)="closeUserMenu()"
          class="flex items-center gap-3 px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 hover:text-[#e07090] transition-colors duration-200 cursor-pointer">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <rect x="3" y="3" width="7" height="9" rx="1" />
            <rect x="14" y="3" width="7" height="5" rx="1" />
            <rect x="14" y="12" width="7" height="9" rx="1" />
            <rect x="3" y="16" width="7" height="5" rx="1" />
          </svg>
          Dashboard
        </a>

        <div class="border-t border-gray-100 mt-1 pt-1">
          <button (click)="onSignout()"
            class="flex items-center gap-3 w-full px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 hover:text-[#e07090] transition-colors duration-200 cursor-pointer">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
            Log out
          </button>
        </div>
      </div>
      }
    </div>
    } @else {
    <button (click)="onLogin()"
      class="flex items-center gap-1.5 text-sm text-gray-700 hover:text-[#e07090] transition-colors duration-200 cursor-pointer">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
        <circle cx="12" cy="7" r="4" />
      </svg>
      <span class="hidden sm:inline">Login</span>
    </button>
    }

    <!-- Divider -->
    <div class="w-px h-5 bg-gray-300"></div>

    <!-- Wishlist / Love -->
    <button (click)="onLove()"
      class="relative text-gray-600 hover:text-[#e07090] transition-colors duration-200 cursor-pointer">
      <img src="images/navIcon/heart.svg" alt="Love Icon" class="w-5 h-5" />
      @if (isLoggedIn() && wishlistCount() > 0) {
      <span
        class="absolute -top-2 -right-2 flex items-center justify-center w-4 h-4 rounded-full bg-[#e07090] text-white text-[10px] leading-none">
        {{ wishlistCount() }}
      </span>
      }
    </button>

    @if (isLoggedIn()) {
    <button (click)="onCart()"
      class="relative text-gray-600 hover:text-[#e07090] transition-colors duration-200 cursor-pointer">
      <img src="images/navIcon/shopping-cart.svg" alt="Cart Icon" class="w-5 h-5" />
      @if (cartCount() > 0) {
      <span
        class="absolute -top-2 -right-2 flex items-center justify-center w-4 h-4 rounded-full bg-[#e07090] text-white text-[10px] leading-none">
        {{ cartCount() }}
      </span>
      }
    </button>
    }

    <button (click)="onNotifications()"
      class="hidden sm:block relative text-gray-600 hover:text-[#e07090] transition-colors duration-200 cursor-pointer">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
        <path d="M13.73 21a2 2 0 0 1-3.46 0" />
      </svg>
      @if (isLoggedIn() && notificationCount() > 0) {
      <span
        class="absolute -top-2 -right-2 flex items-center justify-center w-4 h-4 rounded-full bg-[#e07090] text-white text-[10px] leading-none">
        {{ notificationCount() }}
      </span>
      }
    </button>

    <!-- Divider -->
    <div class="hidden sm:block w-px h-5 bg-gray-300"></div>

    <div class="flex items-center gap-2">
      <lib-language-switcher (languageChanged)="onLanguageChanged($event)"
        classList="text-gray-700 hover:text-[#e07090] font-medium transition-colors duration-200 cursor-pointer"></lib-language-switcher>
      <lib-dark-mode></lib-dark-mode>
    </div>
  </div>
</nav>

<!-- Mobile Search Bar (slides down when toggled) -->
@if (mobileSearchOpen) {
<div class="search-container md:hidden bg-white border-b border-gray-200 px-4 py-2 relative">
  <div
    class="flex items-center border border-gray-300 rounded-md px-4 py-2 gap-2 focus-within:border-[#e07090] transition-colors duration-200">
    <svg class="w-4 h-4 text-gray-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="8" />
      <path d="m21 21-4.35-4.35" />
    </svg>
    <input #mobileSearchInput type="text" placeholder="What awesome gift are you looking for?" [(ngModel)]="searchQuery"
      (focus)="openSearch()" (keyup.enter)="onSearch()"
      class="flex-1 bg-transparent outline-none text-sm text-gray-700 placeholder-gray-400" />
    <button (click)="toggleMobileSearch()" class="text-gray-400 hover:text-gray-600">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M18 6 6 18M6 6l12 12" />
      </svg>
    </button>
  </div>
  @if (searchOpen && searchQuery.trim()) {
  <app-search-products [searchQuery]="searchQuery" (cardSelected)="closeSearch()"></app-search-products>
  }
</div>
}
