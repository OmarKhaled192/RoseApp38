<nav
  class="w-full bg-white border-b border-gray-200 px-4 py-2 md:px-6 flex items-center gap-3 md:gap-4"
>
  <!-- Logo -->
  <a href="#" class="logo-icon shrink-0">
    <img src="/images/logo 1.png" alt="Rose Logo" class="w-10 md:w-12" />
  </a>

  @if (isLoggedIn()) {
  <div class="hidden md:flex items-center gap-2 text-sm text-gray-600 ml-2">
    <svg
      class="w-5 h-5 text-[#e07090]"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      viewBox="0 0 24 24"
    >
      <path d="M12 21s7-4.5 7-11a7 7 0 1 0-14 0c0 6.5 7 11 7 11z" />
      <circle cx="12" cy="10" r="2" />
    </svg>

    <div class="flex flex-col leading-tight">
      <span class="text-[11px] text-gray-400">
        {{ 'navbar.deliverTo' | translate }}
      </span>

      <button
        (click)="openLocationDropdown()"
        class="flex items-center gap-1 font-medium hover:text-[#e07090]"
      >
        {{ 'navbar.location' | translate }}
        <svg
          class="w-3 h-3"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path d="m6 9 6 6 6-6" />
        </svg>
      </button>
    </div>
  </div>
  }

  <div
    class="hidden md:flex flex-1 items-center border border-gray-300 rounded-md px-4 py-2 gap-2 bg-white hover:border-gray-400 focus-within:border-[#e07090] transition-colors duration-200"
  >
    <svg
      class="w-4 h-4 text-gray-400 shrink-0"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      viewBox="0 0 24 24"
    >
      <circle cx="11" cy="11" r="8" />
      <path d="m21 21-4.35-4.35" />
    </svg>

    <input
      type="text"
      [(ngModel)]="searchQuery"
      (keyup.enter)="onSearch()"
      [placeholder]="'navbar.searchPlaceholder' | translate"
      class="flex-1 bg-transparent outline-none text-sm text-gray-700 placeholder-gray-400"
    />
  </div>

  <button
    class="md:hidden ml-auto text-gray-500 hover:text-[#e07090]"
    (click)="toggleMobileSearch()"
  >
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="8" />
      <path d="m21 21-4.35-4.35" />
    </svg>
  </button>

  <div class="flex items-center gap-3 md:gap-4 shrink-0">
    @if (isLoggedIn()) {
    <div class="relative hidden md:block">
      <button
        (click)="toggleUserMenu()"
        class="flex items-center gap-2 hover:opacity-80 transition-opacity"
      >
        <div class="flex flex-col items-start leading-tight">
          <span class="text-xs text-gray-400 font-normal">
            {{ 'navbar.hello' | translate }}
          </span>
          <span class="text-sm font-semibold text-[#8B1A1A]">Jonathan</span>
        </div>

        <svg
          class="w-3 h-3 text-gray-500 mt-1"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          viewBox="0 0 24 24"
        >
          <path d="m6 9 6 6 6-6" />
        </svg>
      </button>

      @if (userMenuOpen) {
      <div
        class="absolute right-0 mt-2 w-52 bg-white border border-gray-200 shadow-xl rounded-xl z-50 overflow-hidden"
      >
        <!-- Name Header -->
        <div
          class="px-4 py-3 text-sm font-semibold text-red-500 border-b border-dashed border-gray-200"
        >
          {{ userName }}
        </div>

        <!-- Account -->
        <button
          class="flex items-center gap-3 w-full px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-50 border-b border-dashed border-gray-200"
        >
          <i class="pi pi-user text-gray-400 text-base"></i>
          {{ 'navbar.account' | translate }}
        </button>

        <!-- Addresses -->
        <button
          class="flex items-center gap-3 w-full px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-50 border-b border-dashed border-gray-200"
        >
          <i class="pi pi-map-marker text-gray-400 text-base"></i>
          {{ 'navbar.addresses' | translate }}
        </button>

        <!-- Orders -->
        <button
          class="flex items-center gap-3 w-full px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-50 border-b border-dashed border-gray-200"
        >
          <i class="pi pi-file-edit text-gray-400 text-base"></i>
          {{ 'navbar.orders' | translate }}
        </button>

        <!-- Dashboard -->
        <button
          class="flex items-center gap-3 w-full px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-50 border-b border-dashed border-gray-200"
        >
          <i class="pi pi-cog text-gray-400 text-base"></i>
          {{ 'navbar.dashboard' | translate }}
        </button>

        <!-- Log out -->
        <button
          (click)="onSignout()"
          class="flex items-center gap-3 w-full px-4 py-2.5 text-sm text-red-500 hover:bg-gray-50"
        >
          <i class="pi pi-sign-out text-red-500 text-base"></i>
          {{ 'navbar.signOut' | translate }}
        </button>
      </div>
      }
    </div>
    }@else {
    <button
      (click)="onLogin()"
      class="flex items-center gap-1.5 text-sm text-gray-700 hover:text-[#e07090]"
    >
      <svg
        class="w-5 h-5"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
        <circle cx="12" cy="7" r="4" />
      </svg>

      <span class="hidden sm:inline"> {{ 'navbar.login' | translate }} </span>
    </button>
    }
    <div class="w-px h-5 bg-gray-300"></div>

    <button (click)="onLove()" class="text-gray-600 hover:text-[#e07090]">
      <img src="images/navIcon/heart.svg" class="w-5 h-5" />
    </button>

    <button (click)="onCart()" class="text-gray-600 hover:text-[#e07090]">
      <img src="images/navIcon/shopping-cart.svg" class="w-5 h-5" />
    </button>

    <button
      (click)="onNotifications()"
      class="hidden sm:block text-gray-600 hover:text-[#e07090]"
    >
      <svg
        class="w-5 h-5"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
        <path d="M13.73 21a2 2 0 0 1-3.46 0" />
      </svg>
    </button>

    <div class="hidden sm:block w-px h-5 bg-gray-300"></div>

    <!-- Language + Dark Mode -->
    <div class="flex items-center gap-2">
      <lib-language-switcher></lib-language-switcher>
      <lib-dark-mode></lib-dark-mode>
    </div>
  </div>
</nav>

<!-- Mobile Search -->
@if (mobileSearchOpen) {
<div class="md:hidden bg-white border-b border-gray-200 px-4 py-2">
  <div class="flex items-center border rounded-md px-4 py-2 gap-2">
    <svg
      class="w-4 h-4 text-gray-400"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24"
    >
      <circle cx="11" cy="11" r="8" />
      <path d="m21 21-4.35-4.35" />
    </svg>

    <input
      type="text"
      [(ngModel)]="searchQuery"
      (keyup.enter)="onSearch()"
      [placeholder]="'navbar.searchPlaceholder' | translate"
      class="flex-1 outline-none text-sm"
    />

    <button (click)="toggleMobileSearch()">
      <svg
        class="w-4 h-4"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path d="M18 6 6 18M6 6l12 12" />
      </svg>
    </button>
  </div>
</div>
}
