<section class="gallery-section">
  <lib-title-section subtitle="Gallery" title="Check Out our Wonderful Gallery">
  </lib-title-section>
  <div class="gallery-wrapper">
    <div class="gallery-grid">
      @for (item of gallery; track item.image) {
      <div class="gallery-item" [class.large]="item.class === 'large'">
        <img [src]="item.image" alt="Gallery Image" />
      </div>
      }
    </div>
  </div>
</section>
