<form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex w-full flex-col px-5 pb-5">
  <!-- Old Password -->
  <div class="w-full">
    <lib-input [label]="'profile.oldPassword' | translate" type="password" placeholder="********"
      [control]="form.controls.currentPassword" />
  </div>

  <!-- Divider -->
  <div class="my-6 h-px w-full bg-gray-200"></div>

  <!-- New Password -->
  <div class="w-full">
    <lib-input [label]="'profile.newPassword' | translate" type="password" placeholder="********"
      [control]="form.controls.newPassword" />
  </div>

  <!-- Confirm Password -->
  <div class="mt-2 w-full">
    <lib-input [label]="'profile.confirmNewPassword' | translate" type="password" placeholder="********"
      [control]="form.controls.confirmPassword" />

    @if (
    form.controls.confirmPassword.touched &&
    form.hasError('passwordMismatch')
    ) {
    <small class="mt-1 block text-xs text-red-500">
      {{ 'profile.passwordMismatch' | translate }}
    </small>
    }
  </div>

  <!-- Button -->
  <div class="mt-16 flex w-full justify-end">
    <button type="submit" [disabled]="isSubmitting()"
      class="h-11 w-[223px] rounded-lg bg-[#b5232b] px-6 text-sm font-medium text-white transition hover:bg-[#991f26] disabled:cursor-not-allowed disabled:opacity-60">
      @if (isSubmitting()) {
      {{ 'profile.changingPassword' | translate }}
      } @else {
      {{ 'profile.changePassword' | translate }}
      }
    </button>
  </div>
</form>
