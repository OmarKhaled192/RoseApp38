@if (open()) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 px-4"
    (click)="onCancel()"
  >
    <div
      class="relative w-full max-w-md rounded-xl bg-white p-8 shadow-xl"
      (click)="$event.stopPropagation()"
    >
      <button
        type="button"
        class="absolute right-5 top-5 text-gray-400 transition hover:text-gray-600"
        (click)="onCancel()"
        aria-label="Close"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-5 w-5"
          viewBox="0 0 20 20"
          fill="currentColor"
        >
          <path
            d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
          />
        </svg>
      </button>

      <div class="flex flex-col items-center text-center">
        <div
          class="mb-5 flex h-16 w-16 items-center justify-center rounded-full bg-gray-100"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-7 w-7 text-gray-700"
            viewBox="0 0 20 20"
            fill="currentColor"
          >
            <path
              fill-rule="evenodd"
              d="M8 2a1 1 0 00-.894.553L6.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-2.382l-.724-1.447A1 1 0 0012 2H8zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm4-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z"
              clip-rule="evenodd"
            />
          </svg>
        </div>

        <p class="mb-8 text-base font-medium text-gray-900">
          {{ title() | translate }}
        </p>

        <div class="grid w-full grid-cols-2 gap-3">
          <button
            type="button"
            class="rounded-lg border border-gray-300 bg-white py-3 text-sm font-semibold text-gray-800 transition hover:bg-gray-50"
            (click)="onCancel()"
          >
            {{ cancelLabel() | translate }}
          </button>

          <button
            type="button"
            class="rounded-lg bg-[#8B1E28] py-3 text-sm font-semibold text-white transition hover:bg-[#731820]"
            (click)="onConfirm()"
          >
            {{ confirmLabel() | translate }}
          </button>
        </div>
      </div>
    </div>
  </div>
}
