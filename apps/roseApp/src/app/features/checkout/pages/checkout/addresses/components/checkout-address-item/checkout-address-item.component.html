<fieldset class="relative rounded-2xl border mb-2 px-4 pb-4 pt-1 transition-colors"
  [class.border-gray-200]="!highlighted()" [class.border-[#8B1E28]]="highlighted()">

  <!-- Fieldset Legend / Header -->
  <legend class="ml-4 px-2 text-base font-bold text-[#8B1E28]">
    {{ groupLabel() }}
  </legend>

  <div class="flex flex-col gap-3 pr-6">

    <!-- Top Row: City & Phone -->
    <div class="flex flex-wrap items-center justify-between gap-2">
      <!-- City & Icon -->
      <div class="flex items-center gap-2.5">
        <span class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-[#00B074] text-white">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"
            stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
        </span>

        <h3 class="text-lg font-bold text-gray-900">
          {{ address().city }}
        </h3>
      </div>

      <!-- Phone Number -->
      <div class="flex items-center gap-2 text-sm font-semibold text-gray-700">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-800" fill="none" viewBox="0 0 24 24"
          stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
        </svg>
        <span>{{ address().phone }}</span>
      </div>
    </div>

    <!-- Street Badge -->
    <div>
      <span class="inline-block rounded-full bg-gray-100 px-3 py-1 text-xs font-medium text-gray-700">
        {{ address().street }}
      </span>
    </div>

  </div>

  <!-- Floating Action Buttons -->
  <div class="absolute -right-3.5 top-1/2 flex -translate-y-1/2 flex-col gap-2">
    <!-- Edit Button -->
    <button type="button"
      class="flex h-7 w-7 items-center justify-center rounded-full border border-gray-300 bg-white text-gray-700 shadow-sm transition hover:bg-gray-50"
      (click)="onEdit($event)" [attr.aria-label]="'Edit address in ' + address().city">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="currentColor">
        <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793z" />
        <path d="M11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" />
      </svg>
    </button>

    <!-- Delete Button -->
    <button type="button"
      class="flex h-7 w-7 items-center justify-center rounded-full bg-[#E52328] text-white shadow-sm transition hover:bg-red-700"
      (click)="onDelete($event)" [attr.aria-label]="'Delete address in ' + address().city">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" clip-rule="evenodd"
          d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" />
      </svg>
    </button>
  </div>

</fieldset>
