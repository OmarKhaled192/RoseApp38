<div class="mx-auto w-full rounded-xl bg-white p-6 sm:p-8">
  @switch (view()) {

  @case ('list') {

  <div class="mb-4 flex items-center justify-between">
    <h1 class="text-2xl font-bold text-gray-900">My Addresses</h1>
  </div>

  @if (addresses().length === 0) {

  <p class="border-t border-gray-200 py-10 text-center text-sm text-gray-500">
    You haven't saved any addresses yet.
  </p>

  } @else {

  <div class="space-y-6  border-gray-200 pt-6">
    @for (group of groupedAddresses(); track group.label) {
    @for (address of group.addresses; track address.id) {

    <app-checkout-address-item class="block cursor-pointer" (click)="selectAddress(address)" [address]="address" [groupLabel]="group.label" [highlighted]="selectedAddressId() === address.id"
      (editRequested)="openEditAddress($event)" (deleteRequested)="requestDelete($event)" />

    }
    }
  </div>

  }

    <div class="relative flex py-5 items-center">
      <div class="flex-grow border-t border-gray-200"></div>
      <span class="flex-shrink-0 mx-4 text-gray-400 text-sm font-semibold">OR</span>
      <div class="flex-grow border-t border-gray-200"></div>
    </div>

    <button type="button"
      class="w-full rounded-lg bg-[#FBEAEB] py-3 text-sm font-semibold text-[#8B1E28] transition hover:bg-red-100 mb-6"
      (click)="openAddAddress()">
      Add a New Address
    </button>

    <div class="flex justify-end pt-4 border-t border-gray-200">
      <button type="button"
        class="rounded-lg bg-[#8B1E28] px-8 py-3 text-sm font-semibold text-white transition hover:bg-red-800 flex items-center gap-2"
        (click)="onNext()" [disabled]="!selectedAddressId()">
        Next
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
        </svg>
      </button>
    </div>

  }

  @case ('add') {

  <app-checkout-add-address mode="add" (saved)="onWizardSaved($event)" (cancelled)="onWizardCancelled()" />

  }

  @case ('edit') {

  <app-checkout-add-address mode="edit" [initialAddress]="editingAddress()" (saved)="onWizardSaved($event)"
    (cancelled)="onWizardCancelled()" />

  }

  }
</div>

<app-checkout-delete-modal [open]="isDeleteModalOpen()" title="Are you sure you want to delete this address?"
  confirmLabel="Confirm" cancelLabel="Cancel" (confirmed)="confirmDelete()" (cancelled)="cancelDelete()" />
