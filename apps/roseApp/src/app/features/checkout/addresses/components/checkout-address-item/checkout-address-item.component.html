<div
  class="flex items-center justify-between gap-4 py-4"
  [class.rounded-lg]="highlighted()"
  [class.border]="highlighted()"
  [class.border-[#8B1E28]]="highlighted()"
  [class.px-4]="highlighted()"
>
  <div class="flex flex-1 items-start gap-3">
    <span class="mt-0.5 flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-emerald-500 text-white">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M9.69 18.933l.003.001C9.89 19.02 10 19 10 19s.11.02.308-.066l.002-.001.006-.003.018-.008a5.741 5.741 0 00.281-.14c.186-.096.446-.24.757-.43.62-.378 1.44-.933 2.26-1.653C15.29 15.146 17 12.5 17 9A7 7 0 103 9c0 3.5 1.71 6.146 3.368 7.699a13.63 13.63 0 002.26 1.653 7.198 7.198 0 00.757.43l.281.14.018.008.006.003zM10 11.25a2.25 2.25 0 100-4.5 2.25 2.25 0 000 4.5z" clip-rule="evenodd" />
      </svg>
    </span>

    <div class="min-w-0">
      <p class="text-base font-semibold text-gray-900">{{ address().city }}</p>
      <p class="mt-1 truncate text-sm text-gray-500">{{ address().addressLine }}</p>
    </div>
  </div>

  <div class="flex items-center gap-4">
    <span class="hidden items-center gap-1.5 text-sm text-gray-600 sm:flex">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
        <path d="M2 3.5A1.5 1.5 0 013.5 2h1.148a1.5 1.5 0 011.465 1.175l.716 3.223a1.5 1.5 0 01-.405 1.417L5.104 9.14c-.32.32-.406.804-.217 1.215a11.05 11.05 0 006.759 6.759c.411.19.895.103 1.214-.217l1.325-1.325a1.5 1.5 0 011.417-.405l3.223.716A1.5 1.5 0 0118 17.35V18.5a1.5 1.5 0 01-1.5 1.5H15c-1.149 0-2.263-.15-3.326-.43A13.022 13.022 0 012.43 10.326 13.019 13.019 0 012 7V3.5z" />
      </svg>
      {{ address().phoneCountryCode }} {{ address().phone }}
    </span>

    <button
      type="button"
      class="flex h-9 w-9 items-center justify-center rounded-full border border-gray-300 text-gray-600 transition hover:bg-gray-50"
      (click)="onEdit()"
      [attr.aria-label]="'Edit address in ' + address().city"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
        <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793z" />
        <path d="M11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" />
      </svg>
    </button>

    <button
      type="button"
      class="flex h-9 w-9 items-center justify-center rounded-full bg-[#8B1E28] text-white transition hover:bg-[#731820]"
      (click)="onDelete()"
      [attr.aria-label]="'Delete address in ' + address().city"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M8.75 1A2.75 2.75 0 006 3.75v.443c-.795.077-1.584.176-2.365.298a.75.75 0 10.23 1.482l.149-.022.841 10.518A2.75 2.75 0 007.596 19h4.807a2.75 2.75 0 002.742-2.53l.841-10.52.149.023a.75.75 0 00.23-1.482A41.03 41.03 0 0014 4.193V3.75A2.75 2.75 0 0011.25 1h-2.5zM10 4c.84 0 1.673.025 2.5.075V3.75c0-.69-.56-1.25-1.25-1.25h-2.5c-.69 0-1.25.56-1.25 1.25v.325C8.327 4.025 9.16 4 10 4zM8.58 7.72a.75.75 0 00-1.5.06l.3 7.5a.75.75 0 101.5-.06l-.3-7.5zm4.34.06a.75.75 0 10-1.5-.06l-.3 7.5a.75.75 0 101.5.06l.3-7.5z" clip-rule="evenodd" />
      </svg>
    </button>
  </div>
</div>
