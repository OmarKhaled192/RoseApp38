<div>
  <h2 class="text-2xl font-bold text-gray-900">{{ heading() }}</h2>

  <div class="my-5 flex items-center gap-0">
    <span class="h-1 flex-1 rounded-l-full bg-[#8B1E28]"></span>
    <span
      class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-[#8B1E28] text-xs font-semibold text-white">1</span>
    <span class="h-1 flex-1 bg-[#8B1E28]"></span>
    <span
      class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-[#8B1E28] text-xs font-semibold text-white">2</span>
    <span class="h-1 flex-1 rounded-r-full bg-[#8B1E28]"></span>
  </div>

  <div class="mb-4 flex items-center gap-3 border-b border-gray-200 pb-4">
    <button type="button" class="flex h-9 w-9 items-center justify-center rounded-full bg-[#8B1E28] text-white"
      (click)="onBack()" aria-label="Back to address details">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd"
          d="M17 10a.75.75 0 01-.75.75H5.612l4.158 3.96a.75.75 0 11-1.04 1.08l-5.5-5.25a.75.75 0 010-1.08l5.5-5.25a.75.75 0 111.04 1.08L5.612 9.25H16.25A.75.75 0 0117 10z"
          clip-rule="evenodd" />
      </svg>
    </button>
    <h3 class="text-lg font-semibold text-[#8B1E28]">Find Your Location</h3>
  </div>

  <div class="relative h-80 w-full overflow-hidden rounded-lg border border-gray-200 bg-gray-100" role="button"
    tabindex="0" (click)="onMapClick()" (keydown)="onMapKeydown($event)"
    style="background-image: linear-gradient(0deg, transparent 24%, rgba(0,0,0,.04) 25%, rgba(0,0,0,.04) 26%, transparent 27%, transparent 74%, rgba(0,0,0,.04) 75%, rgba(0,0,0,.04) 76%, transparent 77%, transparent), linear-gradient(90deg, transparent 24%, rgba(0,0,0,.04) 25%, rgba(0,0,0,.04) 26%, transparent 27%, transparent 74%, rgba(0,0,0,.04) 75%, rgba(0,0,0,.04) 76%, transparent 77%, transparent); background-size: 40px 40px;">
    <button type="button"
      class="absolute right-4 top-4 z-10 flex items-center gap-2 rounded-full border border-[#8B1E28] bg-white px-4 py-2 text-sm font-semibold text-[#8B1E28] shadow-sm transition hover:bg-red-50"
      (click)="$event.stopPropagation(); onFindMyLocation()" [disabled]="locating()">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd"
          d="M10 18a8 8 0 100-16 8 8 0 000 16zm0-2a6 6 0 100-12 6 6 0 000 12zm0-3a3 3 0 100-6 3 3 0 000 6z"
          clip-rule="evenodd" />
      </svg>
      {{ locating() ? 'Locating…' : 'Find My Location' }}
    </button>

    @if (selectedGeo(); as geo) {
    <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-full">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-9 w-9 text-[#8B1E28] drop-shadow" viewBox="0 0 20 20"
        fill="currentColor">
        <path fill-rule="evenodd"
          d="M9.69 18.933l.003.001C9.89 19.02 10 19 10 19s.11.02.308-.066l.002-.001.006-.003.018-.008a5.741 5.741 0 00.281-.14c.186-.096.446-.24.757-.43.62-.378 1.44-.933 2.26-1.653C15.29 15.146 17 12.5 17 9A7 7 0 103 9c0 3.5 1.71 6.146 3.368 7.699a13.63 13.63 0 002.26 1.653 7.198 7.198 0 00.757.43l.281.14.018.008.006.003zM10 11.25a2.25 2.25 0 100-4.5 2.25 2.25 0 000 4.5z"
          clip-rule="evenodd" />
      </svg>
      <p class="mt-1 rounded bg-white px-1.5 py-0.5 text-center text-[10px] text-gray-500 shadow">
        {{ geo.lat.toFixed(4) }}, {{ geo.lng.toFixed(4) }}
      </p>
    </div>
    } @else {
    <p class="absolute inset-x-0 bottom-4 text-center text-sm text-gray-400">
      Tap "Find My Location" or the map to drop a pin
    </p>
    }
  </div>

  <button type="button"
    class="mt-6 w-full rounded-lg bg-[#8B1E28] py-3.5 text-base font-semibold text-white transition hover:bg-[#731820] disabled:cursor-not-allowed disabled:opacity-50"
    [disabled]="!selectedGeo()" (click)="onSubmit()">
    {{ submitLabel() }}
  </button>
</div>
