<div class="flex flex-col items-center justify-center gap-4 py-16 px-4 text-center">
  <div class="flex items-center justify-center w-20 h-20 rounded-full bg-red-50">
    <svg class="w-10 h-10 text-red-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
      stroke-linecap="round" stroke-linejoin="round">
      <path
        d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z" />
    </svg>
  </div>

  <h3 class="text-lg font-bold text-gray-900">
    {{ 'wishlist.emptyTitle' | translate }}
  </h3>

  <p class="text-sm text-gray-400 max-w-xs">
    {{ 'wishlist.emptyDescription' | translate }}
  </p>

  <button routerLink="/roseApp/products" type="button"
    class="flex items-center justify-center gap-2 mt-2 px-6 py-3 rounded-lg bg-[#501419] text-white text-sm font-medium hover:bg-red-900 transition-colors">
    <svg class="w-4 h-4" [class.rotate-180]="('common.currentLang' | translate) === 'ar'" viewBox="0 0 24 24"
      fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5" />
      <path d="M12 19l-7-7 7-7" />
    </svg>

    {{ 'wishlist.continueShopping' | translate }}
  </button>
</div>
