<section class="m-10">
  @if (store.products().length > 0) {
  <div class="relative flex items-center justify-between px-4 py-3 bg-white">
    <div class="flex items-center gap-2">
      <img src="images/wishList/folder-heart.svg" alt="Wishlist" />

      <h2 class="text-5xl font-bold text-gray-900">
        {{ 'wishlist.title' | translate }}
      </h2>

      <span class="mt-8 text-xs text-gray-400">
        {{ store.products().length }} {{store.products().length === 1 ?
        ('wishlist.item' | translate) : ('wishlist.items' | translate) }}
      </span>
    </div>

    <button type="button"
      class="flex items-center gap-1.5 rounded-xl bg-red-500 px-7 py-3 text-sm font-medium text-white transition-colors hover:bg-red-700 active:bg-red-800"
      (click)="openDeleteDialog()">
      <img src="images/wishList/brush-cleaning.svg" alt="" />
      {{ 'wishlist.clearWishlist' | translate }}
    </button>
  </div>

  <hr class="my-4 border-gray-200" />

  @for(item of store.filterProducts(); track item.id) {

  <app-card-list [imageUrl]="item.product.cover" [title]="item.product.title" [rating]="item.product.rating"
    [ratingsCount]="item.product.ratings" [price]="item.product.price" [discountType]="item.product.discountType"
    [discountValue]="item.product.discountValue" [stock]="item.product.stock"
    (remove)="store.removeProductFromWishlist(item.id)" (addToCart)="onAddToCart(item.product.id)" />

  }

  <button type="button" routerLink="/roseApp/products"
    class="mt-4 flex items-center justify-center rounded-lg bg-[#501419] px-5 py-2 text-white transition-colors hover:bg-red-900">
    <img src="images/wishList/move-left.svg" class="mx-1" alt="" />
    {{ 'wishlist.continueShopping' | translate }}
  </button>
  } @else {
  <app-empty-wishlist />
  }
</section>

<app-delete-dialog [(visible)]="showDeleteDialog" (confirm)="removeAllProducts()" />
