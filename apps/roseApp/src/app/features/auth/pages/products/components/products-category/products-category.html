<div class="bg-white rounded-xl border border-gray-100 p-3">
  <h3 class="text-sm font-semibold text-gray-700 px-2 pb-2">Category</h3>

  <ul class="flex flex-col gap-1">
    @for (row of visibleItems(); track row.item.id) {
    <li>
      <button type="button" (click)="onSelect(row.item.id)" [style.paddingLeft.px]="12 + row.depth * 16" [ngClass]="
          row.item.id === selectedId()
            ? 'bg-[#FBE7EA] text-[#A6252A] font-medium'
            : 'text-gray-600 hover:bg-gray-50'
        " class="w-full flex items-center gap-2 py-2 pr-2 rounded-lg text-sm text-left transition-colors">
        <i class="pi text-xs shrink-0" [ngClass]="row.item.icon ?? 'pi-th-large'"></i>
        <span class="truncate">{{ row.item.label }}</span>
      </button>
    </li>
    }
  </ul>
</div>
