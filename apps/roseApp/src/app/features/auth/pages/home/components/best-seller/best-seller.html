<section class="w-full bg-white py-10 px-4 sm:px-8 lg:px-16">
  <div class="flex flex-col lg:flex-row lg:items-center gap-8">

    <div class="lg:w-1/4 flex-shrink-0">
      <span class="text-[11px] font-semibold tracking-widest text-[#FF668B]">{{ 'bestSeller.eyebrow' | translate
        }}</span>

      <h2 class="mt-2 text-2xl sm:text-3xl font-bold leading-tight text-gray-900"
        [innerHTML]="'bestSeller.heading' | translate">
      </h2>

      <p class="mt-3 text-sm text-gray-500 leading-relaxed">
        {{ 'bestSeller.description' | translate }}
      </p>
      <div class="mt-[3rem]">
        <lib-button type="submit" [label]="'bestSeller.exploreGifts' | translate" [icon]="'pi pi-arrow-right'"
          [iconPos]="'right'" [color]="isDark() ? '#FFA6B9' : '#8D1C24'" (click)="exploreGifts()"
          styleClass="w-full py-2.5 sm:py-3 text-sm sm:text-base font-semibold" />
      </div>

    </div>

    <div class="flex-1 min-w-0">
      @if(products() && products().length){
      <p-carousel [value]="products()" [numVisible]="3" [numScroll]="1" [circular]="false"
        [responsiveOptions]="responsiveOptions" [showIndicators]="false" contentClass="gap-4">
        <ng-template #item let-product>
          <div class="px-1.5">
            <lib-card [card]="product" [hoverActions]="[actionsFor(product)[0], actionsFor(product)[1]]"
              [footerActions]="[actionsFor(product)[2]]" />
          </div>
        </ng-template>
      </p-carousel>
      }
    </div>

  </div>
</section>
