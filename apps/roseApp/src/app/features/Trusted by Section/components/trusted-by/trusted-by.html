<section class="w-full mt-20 sm:mt-16 md:mt-20 mb-10 sm:mb-16 md:mb-20 mx-auto rounded-2xl bg-[#FBEAEA] px-4 sm:px-6 md:px-10 py-8 sm:py-10 text-center">
  <h2 class="text-lg sm:text-xl md:text-2xl lg:text-3xl font-extrabold text-[#741C21] mb-6 sm:mb-8 leading-snug px-2">
    {{ 'trustedBy.trustedCompanies' | translate }}
    <span class="text-[#FF668B]">{{ 'trustedBy.number' | translate }}</span>
    {{ 'trustedBy.companies' | translate }}
  </h2>

  <div class="grid grid-cols-2 xs:grid-cols-2 sm:grid-cols-3 md:flex md:flex-wrap items-center justify-items-center md:justify-center gap-x-6 gap-y-6 sm:gap-y-8 md:gap-8">
    @for (company of companies; track company.src) {
      <img
        [src]="company.src"
        [alt]="company.alt"
        class="h-7 sm:h-8 md:h-10 lg:h-11 max-w-[100px] sm:max-w-[120px] md:max-w-35 w-auto object-contain grayscale opacity-55 hover:grayscale-0 hover:opacity-100 transition duration-200"
      />
    }
  </div>
</section>
