<section class="max-w-5xl w-full mx-auto rounded-2xl bg-[#FBEAEA] px-6 sm:px-10 pb-8 sm:py-10 text-center">
  <h2 class="text-xl sm:text-2xl md:text-3xl font-extrabold text-[#741C21] mb-8">
    {{ 'trustedBy.trustedCompanies' | translate }} <span class="text-[#FF668B]">{{ 'trustedBy.number' | translate }}</span> {{ 'trustedBy.companies' | translate }}
  </h2>

  <div class="grid grid-cols-2 sm:grid-cols-3 md:flex md:flex-wrap items-center justify-items-center md:justify-between gap-x-6 gap-y-8 md:gap-8">
    @for (company of companies; track company.src) {
      <img
        [src]="company.src"
        [alt]="company.alt"
        class="h-8 sm:h-9 md:h-10 lg:h-11 max-w-35 w-auto object-contain grayscale opacity-55 hover:grayscale-0 hover:opacity-100 transition duration-200"
      />
    }
  </div>
</section>
