<div class="max-w-[1200px] mx-auto px-4 py-6 flex flex-col lg:flex-row gap-2">
  <aside class="w-full lg:w-[260px] shrink-0 flex flex-col">
    <app-products-category [categories]="categories" [selectedId]="selectedCategoryId()"
      (categorySelect)="onCategorySelect($event)" />

    <app-filters [occasions]="occasions" [value]="filters()" (filtersChange)="onFiltersChange($event)"
      (resetAll)="onResetAll()" />
  </aside>

  <section class="flex-1 flex flex-col">
    @if (pagedProducts().length) {
    <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4">

      @for (product of products(); track product.id) {
      <lib-card [card]="product" [showWishlist]="true" />
      }
    </div>

    <div class="pt-4">
      <lib-pagination [totalRecords]="filteredProducts().length" (pageChange)="onPageChange($event)" />
    </div>
    } @else {
    <div class="flex flex-col items-center justify-center py-20 text-center gap-2">
      <i class="pi pi-inbox text-3xl text-gray-300"></i>
      <p class="text-sm text-gray-500">{{ 'products.noProducts' | translate }}</p>
    </div>
    }
  </section>
</div>
